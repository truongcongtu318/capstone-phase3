# EXPECT DENY by mandate05-native-image-reference, NOT by Kyverno. A first-party
# image pinned by tag alone is refused by the native policy before Kyverno runs,
# because techx-corp images are required to carry @sha256. Kept as evidence that
# the two layers overlap here rather than leaving a gap.
#
# securityContext and resources are present so PodSecurity "restricted" and
# mandate05-native-resource-requirements both pass. techx-tf3 layers three
# admission controls ahead of Kyverno; without these the request is rejected
# before the image policy is ever consulted, which proves nothing.
apiVersion: v1
kind: Pod
metadata:
  name: deny-02-first-party-bare-tag
  namespace: techx-tf3
  labels:
    pm127-admission-test: "true"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/techx-corp:01011a2-30186442291-checkout
      command: ["sleep", "300"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

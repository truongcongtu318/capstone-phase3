# EXPECT DENY by allow-approved-external-image-digests. Deliberately NOT :latest -
# the native image-reference policy blocks :latest before Kyverno sees it, so a
# :latest fixture would test the wrong control. A pinned-looking version tag can
# still be repointed upstream, which is why it is not in the catalogue.
#
# securityContext and resources are present so PodSecurity "restricted" and
# mandate05-native-resource-requirements both pass. techx-tf3 layers three
# admission controls ahead of Kyverno; without these the request is rejected
# before the image policy is ever consulted, which proves nothing.
apiVersion: v1
kind: Pod
metadata:
  name: deny-04-external-bare-tag
  namespace: techx-tf3
  labels:
    pm127-admission-test: "true"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: busybox:1.36
      command: ["sleep", "300"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

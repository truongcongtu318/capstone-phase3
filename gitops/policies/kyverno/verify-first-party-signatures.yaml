apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-first-party-signatures
  annotations:
    policies.kyverno.io/title: Verify TechX first-party signatures and SBOMs
    policies.kyverno.io/category: Mandate 10 Secure Delivery
    policies.kyverno.io/severity: high
    pod-policies.kyverno.io/autogen-controllers: Deployment,DaemonSet,StatefulSet,Job,CronJob,ReplicaSet,ReplicationController
spec:
  # Enforce as of 2026-07-28, after 7A. Every first-party image on every running
  # pod was verified with cosign first - 21 distinct digests, all signed by the
  # workflow identity below. Dead ReplicaSets still reference unsigned digests,
  # so `kubectl rollout undo` into one of those revisions is now refused; the
  # supported rollback is a git revert, which redeploys a digest from
  # values-prod.yaml and those are all signed.
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-techx-main-workflow-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - techx-tf3
              operations:
                - CREATE
                - UPDATE
      verifyImages:
        - imageReferences:
            - "197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/techx-corp@sha256:*"
            # Grafana is first-party but renders as repo:<tag>@sha256:<digest>.
            # Its subchart hardcodes "{{repository}}:{{tag}}@sha256:{{sha}}" with
            # no digest-only branch, so the reference cannot be repinned from
            # values - and repinning would recreate the pod and disturb the
            # PM-176 baked-plugin fix. Widening the glob keeps it under
            # signature and SBOM verification instead of letting it fall through
            # to the external allow-list, where a first-party image does not
            # belong. The digest itself is still verified by the indexDigest
            # condition below.
            - "197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/techx-corp:*@sha256:*"
          required: true
          mutateDigest: false
          verifyDigest: true
          imageRegistryCredentials:
            providers:
              - amazon
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: >-
                      https://github.com/tuu-ngo/Phase3-TF3-Infra-Sentinel/.github/workflows/build-push-ecr.yml@refs/heads/main
                    issuer: https://token.actions.githubusercontent.com
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://cyclonedx.org/bom
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: >-
                          https://github.com/tuu-ngo/Phase3-TF3-Infra-Sentinel/.github/workflows/build-push-ecr.yml@refs/heads/main
                        issuer: https://token.actions.githubusercontent.com
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ bomFormat }}"
                      operator: Equals
                      value: CycloneDX
                    - key: "{{ length(components) }}"
                      operator: GreaterThan
                      value: 0
                    - key: "{{ metadata.properties[?name == 'techx.platform'].value | [0] }}"
                      operator: AnyIn
                      value:
                        - linux/amd64
                        - linux/arm64
                    - key: "{{ regex_match('^sha256:[0-9a-f]{64}$', metadata.properties[?name == 'techx.subjectDigest'].value | [0]) }}"
                      operator: Equals
                      value: true
                    - key: "{{ metadata.properties[?name == 'techx.indexDigest'].value | [0] }}"
                      operator: Equals
                      value: "{{ image.digest }}"
                    - key: "{{ regex_match('^[0-9a-f]{40}$', metadata.properties[?name == 'techx.sourceSha'].value | [0]) }}"
                      operator: Equals
                      value: true

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allow-approved-external-image-digests
  annotations:
    policies.kyverno.io/title: Allow only reviewed external image digests
    policies.kyverno.io/category: Mandate 10 Secure Delivery
    policies.kyverno.io/severity: high
    pod-policies.kyverno.io/autogen-controllers: Deployment,DaemonSet,StatefulSet,Job,CronJob,ReplicaSet,ReplicationController
spec:
  # Enforce as of 2026-07-28. Every image on every running pod in techx-tf3 was
  # evaluated against these rules first: 46 references across 40 pods, none of
  # which this policy would reject. Flipping before that count reached zero
  # would have rejected live workloads on their next reschedule.
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-approved-external-image-digest
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - techx-tf3
              operations:
                - CREATE
                - UPDATE
      validate:
        message: External images must match the reviewed exact-digest catalog.
        foreach:
          - list: "request.object.spec.containers"
            preconditions:
              all:
                # The optional :<tag> covers Grafana, which is first-party but
                # renders as repo:<tag>@sha256:<digest> because its subchart has
                # no digest-only branch. Without it, a first-party image would
                # be judged against the external catalogue it can never appear
                # in, instead of against its signature and SBOM.
                - key: "{{ regex_match('^197826770971[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/techx-corp(:[^@]+)?@sha256:[0-9a-f]{64}$', element.image) }}"
                  operator: Equals
                  value: false
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotIn
                    value:
                      - busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
                      - 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/shopping-copilot@sha256:347bad1eccdd0fd5e20ea2b868359f71ed8da186e5b8f42d90329d2abd49e062
                      - cloudflare/cloudflared:2026.7.1@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
                      - ghcr.io/open-feature/flagd@sha256:e6cca86b29629a06806aa7954b4a9b5f291c30839c6ae4f815dc4ddcee4a0746
                      - jaegertracing/jaeger@sha256:6266573208d665ce5c17483bce0a75d0806480d92c84766d288d0aee885ce708
                      - opensearchproject/opensearch:3.6.0@sha256:b5dd1512af2a99748c942cfbbd7f32162623336b210667d0fc6333c6321f171d
                      - otel/opentelemetry-collector-contrib@sha256:d57bfe8eee2378f31cb1193239fbcac521d54a5a071fca2bfc106916a32b892d
                      - quay.io/kiwigrid/k8s-sidecar:2.7.1@sha256:5bc0c5634d4aae468e27e98bf1aae4f45d82fcbfd73baf4a9d3fb0699c62f83d
                      - quay.io/prometheus/prometheus@sha256:c0b857aead0d5793aa566adb8f49a9983d6f6031652098759d521a330cfa050f
          - list: "request.object.spec.initContainers || []"
            preconditions:
              all:
                # The optional :<tag> covers Grafana, which is first-party but
                # renders as repo:<tag>@sha256:<digest> because its subchart has
                # no digest-only branch. Without it, a first-party image would
                # be judged against the external catalogue it can never appear
                # in, instead of against its signature and SBOM.
                - key: "{{ regex_match('^197826770971[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/techx-corp(:[^@]+)?@sha256:[0-9a-f]{64}$', element.image) }}"
                  operator: Equals
                  value: false
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotIn
                    value:
                      - busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
                      - 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/shopping-copilot@sha256:347bad1eccdd0fd5e20ea2b868359f71ed8da186e5b8f42d90329d2abd49e062
                      - cloudflare/cloudflared:2026.7.1@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
                      - ghcr.io/open-feature/flagd@sha256:e6cca86b29629a06806aa7954b4a9b5f291c30839c6ae4f815dc4ddcee4a0746
                      - jaegertracing/jaeger@sha256:6266573208d665ce5c17483bce0a75d0806480d92c84766d288d0aee885ce708
                      - opensearchproject/opensearch:3.6.0@sha256:b5dd1512af2a99748c942cfbbd7f32162623336b210667d0fc6333c6321f171d
                      - otel/opentelemetry-collector-contrib@sha256:d57bfe8eee2378f31cb1193239fbcac521d54a5a071fca2bfc106916a32b892d
                      - quay.io/kiwigrid/k8s-sidecar:2.7.1@sha256:5bc0c5634d4aae468e27e98bf1aae4f45d82fcbfd73baf4a9d3fb0699c62f83d
                      - quay.io/prometheus/prometheus@sha256:c0b857aead0d5793aa566adb8f49a9983d6f6031652098759d521a330cfa050f
          - list: "request.object.spec.ephemeralContainers || []"
            preconditions:
              all:
                # The optional :<tag> covers Grafana, which is first-party but
                # renders as repo:<tag>@sha256:<digest> because its subchart has
                # no digest-only branch. Without it, a first-party image would
                # be judged against the external catalogue it can never appear
                # in, instead of against its signature and SBOM.
                - key: "{{ regex_match('^197826770971[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com/techx-corp(:[^@]+)?@sha256:[0-9a-f]{64}$', element.image) }}"
                  operator: Equals
                  value: false
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotIn
                    value:
                      - busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
                      - 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/shopping-copilot@sha256:347bad1eccdd0fd5e20ea2b868359f71ed8da186e5b8f42d90329d2abd49e062
                      - cloudflare/cloudflared:2026.7.1@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
                      - ghcr.io/open-feature/flagd@sha256:e6cca86b29629a06806aa7954b4a9b5f291c30839c6ae4f815dc4ddcee4a0746
                      - jaegertracing/jaeger@sha256:6266573208d665ce5c17483bce0a75d0806480d92c84766d288d0aee885ce708
                      - opensearchproject/opensearch:3.6.0@sha256:b5dd1512af2a99748c942cfbbd7f32162623336b210667d0fc6333c6321f171d
                      - otel/opentelemetry-collector-contrib@sha256:d57bfe8eee2378f31cb1193239fbcac521d54a5a071fca2bfc106916a32b892d
                      - quay.io/kiwigrid/k8s-sidecar:2.7.1@sha256:5bc0c5634d4aae468e27e98bf1aae4f45d82fcbfd73baf4a9d3fb0699c62f83d
                      - quay.io/prometheus/prometheus@sha256:c0b857aead0d5793aa566adb8f49a9983d6f6031652098759d521a330cfa050f

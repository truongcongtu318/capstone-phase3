# Deployment aiops-engine (AIO02). Adopt vào ArgoCD 2026-07-28 — nội dung khớp
# nguyên trạng live state để sync đầu tiên không recreate pod.
#
# Credential AWS: qua IRSA (ServiceAccount aiops-engine -> role
# techx-corp-tf3-aiops-engine). Static key của aio2-admin-team đã gỡ khỏi env.
#
# CHƯA sửa, có chủ đích:
#   - imagePullPolicy vẫn Always để giữ nguyên runtime behavior đã adopt.
#   - annotation kubectl.kubernetes.io/restartedAt nằm trong pod template: xoá nó
#     sẽ đổi pod-template-hash và làm pod restart. Giữ nguyên.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-engine
  namespace: techx-tf3
  labels:
    app: aiops-engine
    app.kubernetes.io/name: aiops-engine
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: aiops-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-25T14:43:11+07:00'
      labels:
        app: aiops-engine
        app.kubernetes.io/name: aiops-engine
    spec:
      serviceAccount: aiops-engine
      serviceAccountName: aiops-engine
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: engine
        # First-party signed/SBOM-attested image from build-push-ecr run
        # 30391640750, source 0cd7b98d3342c3af87bace47f584b9ebc6931eea.
        image: 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/techx-corp:6f5d440-30415515350-aiops-engine@sha256:91fa5e1e28e0cf4e0ac0df1769370f66a143ab0f7129e7fff13f68ead93d9f22
        imagePullPolicy: Always
        ports:
        - name: http-metrics
          containerPort: 8000
          protocol: TCP
        env:
        - name: AIOPS_SIMULATION_MODE
          value: 'false'
        - name: PROMETHEUS_URL
          value: http://prometheus.techx-tf3.svc.cluster.local:9090
        - name: JAEGER_URL
          value: http://jaeger.techx-tf3.svc.cluster.local:16686/jaeger/ui
        - name: OPENSEARCH_URL
          value: http://opensearch.techx-tf3.svc.cluster.local:9200
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: aiops-engine-secrets
              key: slack-webhook-url
              optional: true
        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY đã GỠ có chủ đích.
        # Chúng lấy static key của IAM user aio2-admin-team (AdministratorAccess) từ
        # Secret, và env var đè lên IRSA trong chuỗi credential provider của SDK — nên
        # chừng nào còn 2 dòng đó thì IRSA có cũng vô nghĩa.
        # Credential giờ đến từ ServiceAccount aiops-engine -> role
        # techx-corp-tf3-aiops-engine (infra/modules/eks-platform/aiops-engine-irsa.tf).
        - name: AWS_DEFAULT_REGION
          value: ap-southeast-1
        - name: BEDROCK_AWS_REGION
          value: us-east-1
        - name: BEDROCK_MODEL_ID
          value: amazon.nova-lite-v1:0
        - name: BEDROCK_KB_ID
          value: GH3FUCYVOJ
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /readyz
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File

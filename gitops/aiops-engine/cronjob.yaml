# CronJob huấn luyện lại mô hình anomaly, 02:00 thứ Hai giờ VN (19:00 CN UTC).
#
# Dùng cùng ảnh first-party đã ký/SBOM-attest với Deployment để không còn phụ thuộc
# allowlist external image. activeDeadlineSeconds tăng lên 3h vì hai lần chạy gần
# nhất bị kill ở mốc 1h trước khi hoàn tất training.
#
# AWS_ACCESS_KEY_ID/SECRET cũng là static key — gỡ ở Phase 2 cùng lúc với Deployment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-anomaly-training
  namespace: techx-tf3
spec:
  schedule: 0 19 * * 0
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: OnFailure
          dnsPolicy: ClusterFirst
          schedulerName: default-scheduler
          priorityClassName: low-priority
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: trainer
            image: 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/techx-corp:94bad5a-30384952378-aiops-engine@sha256:7eb0b5120232a10266be897de53279dc6d5041f812829fd7a9e732ebd0726954
            imagePullPolicy: Always
            command:
            - python
            - train_anomaly_model_eks.py
            env:
            - name: PROMETHEUS_URL
              value: http://prometheus.techx-tf3.svc.cluster.local:9090
            - name: AIOPS_S3_BUCKET
              value: tf3-aiops-models-197826770971
            - name: AWS_REGION
              value: ap-southeast-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aiops-engine-secrets
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-engine-secrets
                  key: aws-secret-access-key
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: '1'
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 10001
              capabilities:
                drop:
                - ALL
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ad-business-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/rollout-role: "first-canary"
    mandate-17.techx.io/clusterip-proof: "required-before-wider-promotion"
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-25:kube-dns=172.20.0.10,flagd=172.20.213.30,otel-gateway=172.20.117.175"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ad
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.20.0.10/32
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: flagd
        - ipBlock:
            cidr: 172.20.213.30/32
      ports:
        - { protocol: TCP, port: 8013 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-gateway
        - ipBlock:
            cidr: 172.20.117.175/32
      ports:
        - { protocol: TCP, port: 4318 }

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: load-generator-platform-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-25:kube-dns=172.20.0.10,frontend-proxy=172.20.145.28,flagd=172.20.213.30,otel-gateway=172.20.117.175"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: load-generator
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock: { cidr: 172.20.0.10/32 }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend-proxy
        - ipBlock: { cidr: 172.20.145.28/32 }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: flagd
        - ipBlock: { cidr: 172.20.213.30/32 }
      ports:
        - { protocol: TCP, port: 8013 }
        - { protocol: TCP, port: 8016 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-gateway
        - ipBlock: { cidr: 172.20.117.175/32 }
      ports:
        - { protocol: TCP, port: 4317 }

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-business-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-25:kube-dns=172.20.0.10,flagd=172.20.213.30"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: llm
  policyTypes: [Ingress, Egress]
  # Production product-reviews selects Bedrock. Enabling the local-LLM rollback
  # requires a reviewed policy change together with the provider change.
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.20.0.10/32
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: flagd
        - ipBlock:
            cidr: 172.20.213.30/32
      ports:
        - { protocol: TCP, port: 8013 }

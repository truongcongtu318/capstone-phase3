apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-access
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-25:kube-dns=172.20.0.10,prometheus=172.20.123.8,otel-gateway=172.20.117.175"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the OTel gateway may send OTLP/gRPC telemetry to Jaeger.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-gateway
      ports:
        - protocol: TCP
          port: 4317
    # Node-level telemetry agent ingress remains explicit and namespace-scoped.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-node-agent
      ports:
        - protocol: TCP
          port: 8888
    # Query API / UI access remains limited to approved platform workloads.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app: aiops-engine
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 16686
        - protocol: TCP
          port: 16685
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.20.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - ipBlock:
            cidr: 172.20.123.8/32
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-gateway
        - ipBlock:
            cidr: 172.20.117.175/32
      ports:
        - protocol: TCP
          port: 4318

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-business-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-25:kube-dns=172.20.0.10,ad=172.20.65.25,cart=172.20.165.232,checkout=172.20.21.19,currency=172.20.98.73,product-catalog=172.20.145.185,recommendation=172.20.109.11,shipping=172.20.58.251,product-reviews=172.20.242.200,flagd=172.20.213.30,otel-gateway=172.20.117.175"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend-proxy
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.20.0.10/32
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - ad
                  - cart
                  - checkout
                  - currency
                  - product-catalog
                  - recommendation
                  - shipping
        - ipBlock: { cidr: 172.20.65.25/32 }
        - ipBlock: { cidr: 172.20.165.232/32 }
        - ipBlock: { cidr: 172.20.21.19/32 }
        - ipBlock: { cidr: 172.20.98.73/32 }
        - ipBlock: { cidr: 172.20.145.185/32 }
        - ipBlock: { cidr: 172.20.109.11/32 }
        - ipBlock: { cidr: 172.20.58.251/32 }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: product-reviews
        - ipBlock:
            cidr: 172.20.242.200/32
      ports:
        - { protocol: TCP, port: 3551 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: flagd
        - ipBlock:
            cidr: 172.20.213.30/32
      ports:
        - { protocol: TCP, port: 8013 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-gateway
        - ipBlock:
            cidr: 172.20.117.175/32
      ports:
        - { protocol: TCP, port: 4317 }

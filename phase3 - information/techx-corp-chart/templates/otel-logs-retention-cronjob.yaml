{{- if .Values.otelLogsRetention.enabled }}
{{- $r := .Values.otelLogsRetention }}
# Directive #18 A2 - telemetry retention. OpenSearch here runs single-node with
# persistence disabled (emptyDir), so anything stored *inside* OpenSearch - including
# ISM policies in .opendistro-ism-config - is wiped on every pod reschedule. The otel
# gateway writes daily indices (otel-logs-YYYY-MM-DD), so retention is enforced from the
# outside by a stateless CronJob that deletes indices older than retentionDays. Being
# stateless, it self-heals after any OpenSearch restart with no bootstrap to lose.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: otel-logs-retention
  labels:
    helm.sh/chart: {{ include "techx-corp.chart" . }}
    app.kubernetes.io/name: otel-logs-retention
    app.kubernetes.io/component: otel-logs-retention
    app.kubernetes.io/part-of: techx-corp
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ $r.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: otel-logs-retention
            app.kubernetes.io/component: otel-logs-retention
            app.kubernetes.io/part-of: techx-corp
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: {{ $r.image | quote }}
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  ENDPOINT="${OPENSEARCH_ENDPOINT}"
                  PREFIX="${INDEX_PREFIX}"
                  CUTOFF="$(date -u -d "${RETENTION_DAYS} days ago" +%Y-%m-%d)"
                  echo "otel-logs retention: keeping >= ${CUTOFF} (retentionDays=${RETENTION_DAYS})"
                  if ! LIST="$(curl -sf "${ENDPOINT}/_cat/indices/${PREFIX}-*?h=index")"; then
                    echo "WARN: could not list indices (OpenSearch not ready?) - exiting 0, next run retries"
                    exit 0
                  fi
                  rc=0
                  for idx in $(printf '%s\n' "${LIST}" | sort); do
                    d="${idx#${PREFIX}-}"
                    case "${d}" in
                      [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
                        if [[ "${d}" < "${CUTOFF}" ]]; then
                          code="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "${ENDPOINT}/${idx}")"
                          echo "DELETE ${idx} (date ${d}) -> HTTP ${code}"
                          [[ "${code}" == 2* ]] || rc=1
                        else
                          echo "keep   ${idx} (date ${d})"
                        fi
                        ;;
                      *)
                        echo "skip   ${idx} (suffix '${d}' is not YYYY-MM-DD)"
                        ;;
                    esac
                  done
                  exit "${rc}"
              env:
                - name: OPENSEARCH_ENDPOINT
                  value: {{ $r.opensearchEndpoint | quote }}
                - name: INDEX_PREFIX
                  value: {{ $r.indexPrefix | quote }}
                - name: RETENTION_DAYS
                  value: {{ $r.retentionDays | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
